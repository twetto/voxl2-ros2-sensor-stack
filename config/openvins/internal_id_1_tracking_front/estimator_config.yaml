%YAML:1.0

verbosity: "INFO"

use_fej: true
integration: "rk4"
use_stereo: false
max_cameras: 1

# Allow online refinement — with uncalibrated IMU the lever arm drifts, but
# the extrinsics-free run was worse (|p|=44m vs 21m).  Re-enable until proper
# IMU intrinsics arrive.
calib_cam_extrinsics: true
calib_cam_intrinsics: false
calib_cam_timeoffset: false
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

# More clones = longer sliding window, helps triangulate with noisy tracks.
max_clones: 20
max_slam: 75
max_slam_in_update: 30
max_msckf_in_update: 50
dt_slam_delay: 1

gravity_mag: 9.81

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

try_zupt: true
zupt_chi2_multipler: 2
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 0.5
zupt_only_at_beginning: false

init_window_time: 2.0
init_imu_thresh: 0.5
init_max_disparity: 10.0
init_max_features: 50

init_dyn_use: false
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0

init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-12

init_dyn_bias_g: [0.0, 0.0, 0.0]
init_dyn_bias_a: [0.0, 0.0, 0.0]

record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"

save_total_state: true
filepath_est: "/home/twetto/ov_estimate.txt"
filepath_std: "/home/twetto/ov_estimate_std.txt"
filepath_gt: "/home/twetto/ov_groundtruth.txt"

use_klt: true
num_pts: 400
fast_threshold: 10
grid_x: 8
grid_y: 5
min_px_dist: 10
knn_ratio: 0.85
track_frequency: 30.0
downsample_cameras: false
num_opencv_threads: 4
# CLAHE gives better local contrast in dark / low-light scenes where
# global histogram equalization washes out detail.
histogram_method: "CLAHE"

use_aruco: false
num_aruco: 1024
downsize_aruco: true

# Large pixel noise to absorb H.265 compression artefacts and dark-scene
# feature jitter; wider chi2 gate so noisy-but-inlier tracks survive.
up_msckf_sigma_px: 4.0
up_msckf_chi2_multipler: 3
up_slam_sigma_px: 4.0
up_slam_chi2_multipler: 3
up_aruco_sigma_px: 1.0
up_aruco_chi2_multipler: 1

use_mask: false

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
